<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    
    <!-- Pen/Ink Gradient -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth rounded base container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Stylized PDF Document Shield/Page -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Document Base (White/Light gray sheet) -->
    <path d="M 0 0 L 220 0 L 300 80 L 300 320 C 300 331 291 340 280 340 L 20 340 C 9 340 0 331 0 320 Z" fill="#f4f4f5" />
    
    <!-- Folded Corner -->
    <path d="M 220 0 L 220 60 C 220 71 229 80 240 80 L 300 80 Z" fill="#e4e4e7" />
    
    <!-- Text Lines (representing document structure) -->
    <rect x="40" y="80" width="140" height="16" rx="8" fill="#e4e4e7" />
    <rect x="40" y="130" width="220" height="16" rx="8" fill="#e4e4e7" />
    <rect x="40" y="180" width="220" height="16" rx="8" fill="#e4e4e7" />
    <rect x="40" y="230" width="160" height="16" rx="8" fill="#e4e4e7" />
    
    <!-- Red PDF Accent Bar at the bottom -->
    <path d="M 0 310 L 300 310 L 300 320 C 300 331 291 340 280 340 L 20 340 C 9 340 0 331 0 320 Z" fill="#ef4444" />
  </g>

  <!-- Glowing Ink Stroke -->
  <path d="M 120 410 Q 256 370 380 420" fill="none" stroke="url(#inkGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" opacity="0.95" />

  <!-- Stylized Fountain Pen Tip drawing the stroke -->
  <g transform="translate(350, 260) rotate(-15)">
    <!-- Pen Metal Body -->
    <path d="M -20 -140 L 20 -140 L 25 -40 L 40 40 L 0 90 L -40 40 L -25 -40 Z" fill="url(#inkGrad)" />
    <!-- Pen Nib slit -->
    <line x1="0" y1="-40" x2="0" y2="85" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Nib Hole -->
    <circle cx="0" cy="-40" r="10" fill="#ffffff" />
  </g>
</svg>